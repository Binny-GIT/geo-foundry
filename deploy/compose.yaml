# Geo Foundry CMS — base service definition
# Overlay with compose.verify.yaml or compose.mk-dev.yaml.
#
# `name:` is set explicitly because Compose otherwise derives the project
# name from this file's directory ("deploy") — a name generic enough to
# collide with an unrelated project's own unnamed "deploy/" compose stack.
# Such a collision lets that other project's `docker compose down
# --remove-orphans` treat our container as one of its own orphans and
# delete it (confirmed root cause of two unexplained outages on 2026-08-24).
# Pinning a unique name scopes orphan detection to this project only.
name: geo-foundry-${COMPOSE_ENV:?COMPOSE_ENV is required}

services:
  cms:
    image: geo-foundry-cms:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: geo-foundry-cms-${COMPOSE_ENV:?COMPOSE_ENV is required}
    restart: unless-stopped
    ports:
      - "${CMS_BIND:-127.0.0.1:3090}:3090"
    environment:
      NODE_ENV: production
      PORT: "3090"
      HOSTNAME: 0.0.0.0
      GEO_FOUNDRY_PG_HOST: ${GEO_FOUNDRY_PG_HOST:?GEO_FOUNDRY_PG_HOST is required}
      GEO_FOUNDRY_PG_PORT: ${GEO_FOUNDRY_PG_PORT:-5432}
      GEO_FOUNDRY_PG_BOOTSTRAP_DATABASE: postgres
      GEO_FOUNDRY_PG_DATABASE: geo_foundry
      GEO_FOUNDRY_PG_SCHEMA: geo_foundry
      GEO_FOUNDRY_CREDENTIAL_MODE: file
      GEO_FOUNDRY_PG_USER_FILE: /run/geo-foundry/credentials/pg-user
      GEO_FOUNDRY_PG_PASSWORD_FILE: /run/geo-foundry/credentials/pg-password
      GEO_FOUNDRY_S3_ENDPOINT: ${GEO_FOUNDRY_S3_ENDPOINT:?GEO_FOUNDRY_S3_ENDPOINT is required}
      GEO_FOUNDRY_S3_PORT: ${GEO_FOUNDRY_S3_PORT:-9000}
      GEO_FOUNDRY_S3_USE_SSL: "false"
      GEO_FOUNDRY_S3_ACCESS_KEY_FILE: /run/geo-foundry/credentials/s3-access-key
      GEO_FOUNDRY_S3_SECRET_KEY_FILE: /run/geo-foundry/credentials/s3-secret-key
      GEO_FOUNDRY_S3_FORCE_PATH_STYLE: "true"
      GEO_FOUNDRY_S3_SECRET_REF: rustfs-geo-foundry-svc
      GEO_FOUNDRY_CMS_SECRET_FILE: /run/geo-foundry/credentials/cms-secret
      GEO_FOUNDRY_REDIS_HOST: ${GEO_FOUNDRY_REDIS_HOST:-127.0.0.1}
      GEO_FOUNDRY_REDIS_PORT: ${GEO_FOUNDRY_REDIS_PORT:-6379}
      GEO_FOUNDRY_REDIS_DATABASE: ${GEO_FOUNDRY_REDIS_DATABASE:-0}
      GEO_FOUNDRY_REDIS_PASSWORD_FILE: /run/geo-foundry/credentials/redis-password
    volumes:
      - type: bind
        source: ${GEO_FOUNDRY_CREDENTIALS_DIR:?GEO_FOUNDRY_CREDENTIALS_DIR is required}
        target: /run/geo-foundry/credentials
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3090/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  worker:
    profiles: ["runtime"]
    image: geo-foundry-cms:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: geo-foundry-worker-${COMPOSE_ENV:?COMPOSE_ENV is required}
    restart: unless-stopped
    command: ["node", "/worker/dist/main.js"]
    environment:
      NODE_ENV: production
      CMS_BASE_URL: http://cms:3090
      GEO_FOUNDRY_CREDENTIAL_MODE: file
      CONTENT_SERVICE_KEYRING_FILE: /run/geo-foundry/credentials/content-service-keyring.json
      GEO_FOUNDRY_REDIS_HOST: ${GEO_FOUNDRY_REDIS_HOST:-127.0.0.1}
      GEO_FOUNDRY_REDIS_PORT: ${GEO_FOUNDRY_REDIS_PORT:-6379}
      GEO_FOUNDRY_REDIS_DATABASE: ${GEO_FOUNDRY_REDIS_DATABASE:-0}
      GEO_FOUNDRY_REDIS_PASSWORD_FILE: /run/geo-foundry/credentials/redis-password
      GEO_FOUNDRY_WORKER_QUEUE_PREFIX: ${GEO_FOUNDRY_WORKER_QUEUE_PREFIX:-geo-foundry}
      GEO_FOUNDRY_S3_ENDPOINT: ${GEO_FOUNDRY_S3_ENDPOINT:?GEO_FOUNDRY_S3_ENDPOINT is required}
      GEO_FOUNDRY_S3_PORT: ${GEO_FOUNDRY_S3_PORT:-9000}
      GEO_FOUNDRY_S3_USE_SSL: "false"
      GEO_FOUNDRY_S3_ACCESS_KEY_FILE: /run/geo-foundry/credentials/s3-access-key
      GEO_FOUNDRY_S3_SECRET_KEY_FILE: /run/geo-foundry/credentials/s3-secret-key
      GEO_FOUNDRY_S3_BUCKET: ${GEO_FOUNDRY_S3_BUCKET:-geo-foundry}
      GEO_FOUNDRY_S3_KEY_PREFIX: ${GEO_FOUNDRY_S3_KEY_PREFIX:-objects}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      AI_MAX_RESPONSE_BYTES: ${AI_MAX_RESPONSE_BYTES:-}
      AI_API_KEY_FILE: /run/geo-foundry/credentials/ai-api-key
    volumes:
      - type: bind
        source: ${GEO_FOUNDRY_CREDENTIALS_DIR:?GEO_FOUNDRY_CREDENTIALS_DIR is required}
        target: /run/geo-foundry/credentials
        read_only: true
    healthcheck:
      disable: true
    depends_on:
      cms:
        condition: service_healthy
