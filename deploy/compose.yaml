# Geo Foundry CMS — base service definition
# Overlay with compose.verify.yaml or compose.mk-dev.yaml.

services:
  cms:
    image: geo-foundry-cms:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: geo-foundry-cms-${COMPOSE_ENV:?COMPOSE_ENV is required}
    restart: unless-stopped
    ports:
      - "${CMS_BIND:-127.0.0.1:3090}:3090"
    environment:
      NODE_ENV: production
      PORT: "3090"
      HOSTNAME: 0.0.0.0
      GEO_FOUNDRY_PG_HOST: ${GEO_FOUNDRY_PG_HOST:?GEO_FOUNDRY_PG_HOST is required}
      GEO_FOUNDRY_PG_PORT: ${GEO_FOUNDRY_PG_PORT:-5432}
      GEO_FOUNDRY_PG_BOOTSTRAP_DATABASE: postgres
      GEO_FOUNDRY_PG_DATABASE: geo_foundry
      GEO_FOUNDRY_PG_SCHEMA: geo_foundry
      GEO_FOUNDRY_PG_USER: ${GEO_FOUNDRY_PG_USER:?GEO_FOUNDRY_PG_USER is required}
      GEO_FOUNDRY_PG_PASSWORD: ${GEO_FOUNDRY_PG_PASSWORD:?GEO_FOUNDRY_PG_PASSWORD is required}
      GEO_FOUNDRY_S3_ENDPOINT: ${GEO_FOUNDRY_S3_ENDPOINT:?GEO_FOUNDRY_S3_ENDPOINT is required}
      GEO_FOUNDRY_S3_PORT: ${GEO_FOUNDRY_S3_PORT:-9000}
      GEO_FOUNDRY_S3_USE_SSL: "false"
      GEO_FOUNDRY_S3_ACCESS_KEY: ${GEO_FOUNDRY_S3_ACCESS_KEY:?GEO_FOUNDRY_S3_ACCESS_KEY is required}
      GEO_FOUNDRY_S3_SECRET_KEY: ${GEO_FOUNDRY_S3_SECRET_KEY:?GEO_FOUNDRY_S3_SECRET_KEY is required}
      GEO_FOUNDRY_S3_FORCE_PATH_STYLE: "true"
      GEO_FOUNDRY_S3_SECRET_REF: rustfs-geo-foundry-svc
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3090/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
