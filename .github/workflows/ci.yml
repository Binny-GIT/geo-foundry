name: Geo Foundry CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_shared_services:
        description: Run the protected shared-service validation job
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: geo-foundry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public:
    name: Public non-secret verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEO_FOUNDRY_CI_BASE_SHA: ${{ github.event_name == 'push' && !startsWith(github.event.before, '0000000000') && github.event.before || '' }}
      TURBO_REMOTE_CACHE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Verify non-secret CI gates
        run: pnpm ci:verify

  shared-services:
    name: Protected shared-service validation
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_shared_services == true &&
      github.ref_protected
    runs-on: [self-hosted, geo-foundry-protected]
    timeout-minutes: 45
    environment: protected-shared-services
    env:
      TURBO_REMOTE_CACHE: "0"
      GEO_FOUNDRY_PG_HOST: 127.0.0.1
      GEO_FOUNDRY_PG_PORT: "5432"
      GEO_FOUNDRY_PG_BOOTSTRAP_DATABASE: postgres
      GEO_FOUNDRY_PG_DATABASE: geo_foundry
      GEO_FOUNDRY_PG_SCHEMA: geo_foundry
      GEO_FOUNDRY_REDIS_HOST: 127.0.0.1
      GEO_FOUNDRY_REDIS_PORT: "6379"
      GEO_FOUNDRY_REDIS_DATABASE: "0"
      GEO_FOUNDRY_S3_ENDPOINT: 127.0.0.1
      GEO_FOUNDRY_S3_PORT: "9000"
      GEO_FOUNDRY_S3_USE_SSL: "false"
      GEO_FOUNDRY_S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve runner-local report directories
        run: |
          set -eu
          printf 'GEO_FOUNDRY_EVIDENCE_DIR=%s\n' "$RUNNER_TEMP/geo-foundry-reports/${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          printf 'GEO_FOUNDRY_SHARED_SERVICES_STATE_DIR=%s\n' "$RUNNER_TEMP/geo-foundry-shared-services" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Materialize owner-only credential references
        env:
          PG_USER: ${{ secrets.GEO_FOUNDRY_PG_USER }}
          PG_PASSWORD: ${{ secrets.GEO_FOUNDRY_PG_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.GEO_FOUNDRY_REDIS_PASSWORD }}
          CMS_SECRET: ${{ secrets.GEO_FOUNDRY_CMS_SECRET }}
          S3_ACCESS_KEY: ${{ secrets.GEO_FOUNDRY_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.GEO_FOUNDRY_S3_SECRET_KEY }}
        run: |
          set -eu
          umask 077
          credentials_dir="$RUNNER_TEMP/geo-foundry-credentials"
          mkdir -p "$credentials_dir"
          printf '%s' "$PG_USER" > "$credentials_dir/pg-user"
          printf '%s' "$PG_PASSWORD" > "$credentials_dir/pg-password"
          printf '%s' "$REDIS_PASSWORD" > "$credentials_dir/redis-password"
          printf '%s' "$CMS_SECRET" > "$credentials_dir/cms-secret"
          printf '%s' "$S3_ACCESS_KEY" > "$credentials_dir/s3-access-key"
          printf '%s' "$S3_SECRET_KEY" > "$credentials_dir/s3-secret-key"
          {
            printf 'GEO_FOUNDRY_PG_USER_FILE=%s\n' "$credentials_dir/pg-user"
            printf 'GEO_FOUNDRY_PG_PASSWORD_FILE=%s\n' "$credentials_dir/pg-password"
            printf 'GEO_FOUNDRY_REDIS_PASSWORD_FILE=%s\n' "$credentials_dir/redis-password"
            printf 'GEO_FOUNDRY_CMS_SECRET_FILE=%s\n' "$credentials_dir/cms-secret"
            printf 'GEO_FOUNDRY_S3_ACCESS_KEY_FILE=%s\n' "$credentials_dir/s3-access-key"
            printf 'GEO_FOUNDRY_S3_SECRET_KEY_FILE=%s\n' "$credentials_dir/s3-secret-key"
          } >> "$GITHUB_ENV"

      - name: Verify approved shared-service namespace
        run: pnpm shared:check -- --run-id task-40-ci-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run protected E2E and fault matrix
        env:
          GEO_FOUNDRY_FAULTS_ENABLED: "true"
        run: |
          pnpm test:e2e
          pnpm test:faults

      - name: Cleanup only this shared-service namespace
        if: always()
        run: pnpm shared:cleanup -- --run-id task-40-ci-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove credential files
        if: always()
        run: rm -rf "$RUNNER_TEMP/geo-foundry-credentials"

      - name: Upload protected test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GEO_FOUNDRY_EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 7
